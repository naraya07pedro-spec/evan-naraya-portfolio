# Research-only major-version compatibility probe. Nothing published or merged.
name: Temporary Zod 4 runtime compatibility tests
on:
  push:
    branches: [security/portfolio-zod4-runtime-compat-probe-20261112]
permissions:
  contents: read
jobs:
  runtime:
    if: "startsWith(github.event.head_commit.message, 'chore(security): test portfolio Zod4 runtime compatibility')"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build isolated patched dependency tree without peer bypass
        run: |
          mkdir -p artifacts/zod4-runtime-probe
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --global npm@11 --ignore-scripts --no-audit --no-fund
          npm pkg set overrides.zod=4.6.7
          npm install --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const j=JSON.parse(readFileSync('package-lock.json','utf8'));
          const matches=Object.entries(j.packages).filter(([k])=>k==='node_modules/zod'||k.endsWith('/node_modules/zod')).map(([k,v])=>({path:k,version:v.version}));
          if(!matches.length||matches.some(x=>x.version!=='4.6.7'))throw Error('Unpatched Zod remains');
          if(j.packages['node_modules/fast-uri']?.version!=='3.1.9')throw Error('fast-uri patch missing');
          console.log(JSON.stringify({zod:matches,fastUri:'3.1.9',chromiumBidiExpectedZod:j.packages['node_modules/chromium-bidi']?.dependencies?.zod}));
          NODE
          npm audit --audit-level=moderate --json > artifacts/zod4-runtime-probe/audit.json
          git diff --check
          git diff -- package.json package-lock.json > artifacts/zod4-runtime-probe/candidate.patch
      - name: Install actual browsers and pass full Portfolio interactions
        run: |
          npx playwright install --with-deps chromium firefox
          npm run verify
          npm run test:e2e
          npm run test:responsive
          node scripts/scan-public-secrets.mjs
      - name: Execute actual WebDriver BiDi through Chromium and Zod 4
        run: |
          node --input-type=module <<'NODE' | tee artifacts/zod4-runtime-probe/bidi-smoke.json
          import puppeteer from 'puppeteer-core';
          import {chromium} from 'playwright';
          let browser;
          try {
            browser=await puppeteer.launch({executablePath:chromium.executablePath(),headless:true,protocol:'webDriverBiDi',args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage();
            await page.goto('data:text/html,<title>BiDi smoke</title><h1>verified</h1>');
            const title=await page.title();
            const value=await page.evaluate(()=>document.querySelector('h1')?.textContent);
            if(title!=='BiDi smoke'||value!=='verified')throw Error('WebDriver BiDi DOM interaction incorrect');
            console.log(JSON.stringify({browser:'Chromium',driver:'puppeteer-core',protocol:'webDriverBiDi',title,value,passed:true}));
          } finally {await browser?.close();}
          NODE
      - name: Execute real Lighthouse performance audits
        run: |
          export BROWSER_EXECUTABLE="$(node --input-type=module -e 'import {chromium} from "playwright"; console.log(chromium.executablePath())')"
          npm run audit:performance
          node --input-type=module <<'NODE' | tee artifacts/zod4-runtime-probe/performance-check.json
          import {readFileSync} from 'node:fs';
          const a=JSON.parse(readFileSync('artifacts/performance/summary.json','utf8'));
          if(a.results?.length!==4||a.results.some(x=>!Number.isFinite(x.LCPms)||!Number.isFinite(x.CLS)||!Number.isFinite(x.TBTms)))throw Error('Missing Lighthouse performance metrics');
          console.log(JSON.stringify({reports:a.results.length,versions:[...new Set(a.results.map(x=>x.lighthouseVersion))],passed:true}));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-zod4-runtime-compatibility-${{ github.sha }}
          path: |
            artifacts/zod4-runtime-probe/*
            artifacts/portfolio-dependency-audit.json
            artifacts/public-secret-scan.json
            artifacts/performance/summary.json
            package.json
            package-lock.json
          retention-days: 14
          if-no-files-found: error
