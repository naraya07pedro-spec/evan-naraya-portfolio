# Transient read-only portfolio dependency remediation research.
name: Temporary portfolio dependency security probes
on:
  push:
    branches:
      - security/portfolio-upstream-audit-probe-20261112
permissions:
  contents: read
jobs:
  compatible:
    if: "startsWith(github.event.head_commit.message, 'chore(security): run portfolio upstream probes')"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Probe npm registry versions, no package scripts
        run: |
          mkdir -p artifacts/upstream-probe
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --global npm@11 --ignore-scripts --no-audit --no-fund
          npm --version > artifacts/upstream-probe/npm-version.txt
          npm view lighthouse@latest version dependencies.puppeteer-core --json > artifacts/upstream-probe/lighthouse-latest.json
          npm view puppeteer-core@latest version dependencies.chromium-bidi --json > artifacts/upstream-probe/puppeteer-latest.json
          npm view chromium-bidi@latest version dependencies.zod --json > artifacts/upstream-probe/chromium-bidi-latest.json
          npm view zod@latest version --json > artifacts/upstream-probe/zod-latest.json
          npm audit --json > artifacts/upstream-probe/audit-before.json || true
      - name: Update compatible fast-uri without override or force
        run: |
          npm update fast-uri --ignore-scripts --no-audit --no-fund > artifacts/upstream-probe/npm-update.txt 2>&1
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --json > artifacts/upstream-probe/audit-after.json || true
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const l=JSON.parse(readFileSync('package-lock.json','utf8'));
          const b=JSON.parse(readFileSync('artifacts/upstream-probe/audit-before.json','utf8'));
          const a=JSON.parse(readFileSync('artifacts/upstream-probe/audit-after.json','utf8'));
          const p={before:b.metadata?.vulnerabilities??null,after:a.metadata?.vulnerabilities??null,fastUri:l.packages['node_modules/fast-uri']?.version,zod:l.packages['node_modules/zod']?.version,chromiumBidi:l.packages['node_modules/chromium-bidi']?.version,devOnly:{fastUri:l.packages['node_modules/fast-uri']?.dev,zod:l.packages['node_modules/zod']?.dev},changed:'npm update fast-uri',commit:false};
          writeFileSync('artifacts/upstream-probe/summary.json',JSON.stringify(p,null,2)+'\n');
          console.log(JSON.stringify(p));
          NODE
          git diff --check
          git diff -- package.json package-lock.json > artifacts/upstream-probe/candidate.patch
          npm run verify
          npm run test:responsive
          node scripts/scan-public-secrets.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-upstream-compatible-${{ github.sha }}
          path: |
            artifacts/upstream-probe/*
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 14
  force-zod-probe:
    if: "startsWith(github.event.head_commit.message, 'chore(security): run portfolio upstream probes')"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Evaluate whether Zod major override is technically feasible (NO PUBLISH)
        run: |
          mkdir -p artifacts/zod4-probe
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --global npm@11 --ignore-scripts --no-audit --no-fund
          npm pkg set overrides.zod=4.6.7
          set +e
          npm install --ignore-scripts --no-audit --no-fund > artifacts/zod4-probe/install.txt 2>&1
          code=$?
          set -e
          echo "$code" > artifacts/zod4-probe/install.exit
          if [ "$code" -eq 0 ]; then
            npm audit --json > artifacts/zod4-probe/audit.json || true
            node -e "import('lighthouse').then(()=>console.log('lighthouse import passed'))" > artifacts/zod4-probe/import.txt 2>&1 || true
            node -e "import('puppeteer-core').then(()=>console.log('puppeteer import passed'))" >> artifacts/zod4-probe/import.txt 2>&1 || true
            git diff -- package.json package-lock.json > artifacts/zod4-probe/candidate.patch
          fi
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync,existsSync} from 'node:fs';
          const l=JSON.parse(readFileSync('package-lock.json','utf8'));
          const c=Number(readFileSync('artifacts/zod4-probe/install.exit','utf8'));
          const a=existsSync('artifacts/zod4-probe/audit.json')?JSON.parse(readFileSync('artifacts/zod4-probe/audit.json','utf8')):null;
          const p={installExit:c,lockedZod:l.packages['node_modules/zod']?.version,chromiumBidiRequiresZod:l.packages['node_modules/chromium-bidi']?.dependencies?.zod,audit:a?.metadata?.vulnerabilities??null,majorOverrideIsUnvalidated:true,doNotPublish:true};
          writeFileSync('artifacts/zod4-probe/summary.json',JSON.stringify(p,null,2)+'\n');console.log(JSON.stringify(p));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-zod4-risk-probe-${{ github.sha }}
          path: artifacts/zod4-probe/*
          retention-days: 14
          if-no-files-found: error
