# One-time npm lockfile generator scoped to this security patch branch only.
name: Temporary portfolio native Puppeteer patch generator
on:
  push:
    branches: [security/portfolio-puppeteer-25-17-upgrade-20261112]
permissions:
  contents: write
jobs:
  generate:
    if: "startsWith(github.event.head_commit.message, 'chore(security): generate native Puppeteer security lockfile')"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Generate npm-resolved pinned Puppeteer dependency tree
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --global npm@11 --ignore-scripts --no-audit --no-fund
          npm pkg set overrides.puppeteer-core=25.17.0
          npm install --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const p=JSON.parse(readFileSync('package.json','utf8'));
          const l=JSON.parse(readFileSync('package-lock.json','utf8'));
          const expected=[['node_modules/lighthouse','13.5.0'],['node_modules/puppeteer-core','25.17.0'],['node_modules/chromium-bidi','157.0.8090-0'],['node_modules/zod','4.6.7'],['node_modules/fast-uri','3.1.9']];
          for(const [k,v] of expected)if(l.packages?.[k]?.version!==v)throw Error(k+': expected '+v+', got '+l.packages?.[k]?.version);
          if(p.overrides?.['puppeteer-core']!=='25.17.0'||l.packages['node_modules/chromium-bidi']?.dependencies?.zod!=='^4.6.5')throw Error('Wrong native compatible dependency range');
          const zods=Object.entries(l.packages).filter(([k])=>k==='node_modules/zod'||k.endsWith('/node_modules/zod'));
          if(zods.length!==1||zods[0][1].version!=='4.6.7')throw Error('Unexpected duplicate or unpatched Zod resolution');
          console.log(JSON.stringify({verified:true,packages:expected,bidiZodRange:'^4.6.5'}));
          NODE
          npm audit --audit-level=moderate --json > artifacts/portfolio-dependency-audit.json
          npm run verify
          node scripts/scan-public-secrets.mjs
          git diff --check
          OTHER=$(git diff --name-only | grep -v -E '^(package.json|package-lock.json)$' || true)
          if [ -n "$OTHER" ]; then echo "Unexpected modified paths: $OTHER"; exit 1; fi
      - name: Commit only npm-created package files to branch
        run: |
          test "$GITHUB_REF" = "refs/heads/security/portfolio-puppeteer-25-17-upgrade-20261112"
          git add -- package.json package-lock.json
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          OTHER=$(git diff --cached --name-only | grep -v -E '^(package.json|package-lock.json)$' || true)
          if [ -n "$OTHER" ]; then echo "Unexpected staged paths: $OTHER"; exit 1; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(deps): upgrade Puppeteer within Lighthouse range to patched native Zod4 chain'
          git push origin HEAD:refs/heads/security/portfolio-puppeteer-25-17-upgrade-20261112
