name: Portfolio quality
on:
  pull_request:
  merge_group:
  push:
    branches: [main, "chore/portfolio-engineering-upgrade-*"]
permissions:
  contents: read
concurrency:
  group: portfolio-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run verify
      - run: npm run test:e2e
      - run: npm run test:console
      - run: npm run test:visual:responsive
      - run: npm run test:responsive
      - name: Dependency and known-secret verification
        run: |
          npm audit --audit-level=moderate --json > artifacts/portfolio-dependency-audit.json
          node scripts/scan-public-secrets.mjs
      - name: Measure original-main and current-draft performance
        run: |
          export BROWSER_EXECUTABLE="$(node --input-type=module -e 'import {chromium} from "playwright"; console.log(chromium.executablePath())')"
          npm run audit:performance
      - name: Package reviewed source and patch
        run: node scripts/package-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-quality-${{ github.sha }}
          # Public QA and tracked review source only; no private/downloaded PDF evidence.
          path: |
            artifacts/visual/*.png
            artifacts/visual/results.json
            artifacts/accessibility/*.json
            artifacts/responsive/*.png
            artifacts/responsive/*-geometry.json
            artifacts/responsive-visual/*.png
            artifacts/responsive-visual/results.json
            artifacts/responsive-visual/business-copy-geometry.json
            artifacts/performance/*.json
            artifacts/performance/*.html
            artifacts/business-scene-qa/*.png
            artifacts/business-scene-qa/results.json
            artifacts/console-integration/*.png
            artifacts/console-integration/results.json
            artifacts/portfolio-dependency-audit.json
            artifacts/public-secret-scan.json
            artifacts/review-packages/*
          retention-days: 14
